name: CI (develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout osbkt
        uses: actions/checkout@v4

      - name: Checkout osb.core
        uses: actions/checkout@v4
        with:
          repository: osb-foundation/osb.core
          path: ../osb.core

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install Cake tool
        run: dotnet tool install --global Cake.Tool

      - name: Validate version metadata (SemVer)
        run: dotnet cake scripts/validate-version.cake --versionJson=version.json --expectGeneration=0 --expectCodename=Olorun

      - name: Build OSB Toolkit (osbkt)
        run: dotnet build -c Release OsbKT.csproj -v q -nologo
